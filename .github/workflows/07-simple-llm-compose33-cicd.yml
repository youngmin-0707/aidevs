name: 07 Simple Multi-LLM Compose33 CI CD

on:
  push:
    branches:
      - main
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/backend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/frontend/**"
      - ".github/workflows/07-simple-llm-compose33-cicd.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/backend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/frontend/**"
      - ".github/workflows/07-simple-llm-compose33-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy existing images to AWS EC2"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simple-llm-compose33-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33
  BACKEND_IMAGE: young0707/simple-backend:ci
  FRONTEND_IMAGE: young0707/simple-frontend:ci

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Test backend contracts
        run: python -m pytest backend/test_app.py -q

      - name: Validate backend compose
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/backend
        run: docker compose -f compose.yml config --quiet
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          DATABASE_URL: postgresql://agent_user:agent_pwd@127.0.0.1:5433/agent_db
          REDIS_URL: redis://127.0.0.1:6379/0

      - name: Validate frontend compose
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/frontend
        run: docker compose -f compose.yml config --quiet
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_URL: http://127.0.0.1:8000

  deploy:
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.AWS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync backend compose file
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "mkdir -p ~/simple-multi-llm/backend/database"
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ env.PROJECT_DIR }}/backend/compose.release.yml \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/simple-multi-llm/backend/
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ env.PROJECT_DIR }}/backend/database/init.sql \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/simple-multi-llm/backend/database/

      - name: Sync frontend compose file
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "mkdir -p ~/simple-multi-llm/frontend"
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ env.PROJECT_DIR }}/frontend/compose.release.yml \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/simple-multi-llm/frontend/

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "cd ~/simple-multi-llm/backend && \
             test -f .env.docker && \
             docker compose -f compose.release.yml pull && \
             docker compose -f compose.release.yml up -d && \
             docker image prune -f"

      - name: Wait for backend readiness
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "curl --fail --retry 18 --retry-delay 5 http://127.0.0.1:8000/health/ready"

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "cd ~/simple-multi-llm/frontend && \
             test -f .env.docker && \
             docker compose -f compose.release.yml pull && \
             docker compose -f compose.release.yml up -d && \
             docker image prune -f"
