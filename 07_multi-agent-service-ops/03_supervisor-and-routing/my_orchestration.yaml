supervisor:
  agent_id: supervisor_agent
  name: 콘텐츠 제작 Supervisor
  goal: 현재 State를 확인하고 허용된 다음 Worker 또는 종료를 선택한다.
  instructions: |
    직접 콘텐츠를 기획하거나 작성하거나 검토하지 마세요.
    Python이 제시한 현재 허용 행동만 선택하고 선택 이유를 설명하세요.
  provider: openai
  output_contract: ContentSupervisorDecision

workers:
  planner_agent:
    name: 교육 콘텐츠 기획 Agent
    goal: 독자와 학습 목표에 맞는 교육용 블로그 글의 기획을 작성한다.
    instructions: |
      대상 독자, 학습 목표, 핵심 포인트와 문체를 구체적으로 정하세요.
      본문 초안을 대신 작성하지 마세요.
    provider: openai
    output_contract: ContentPlanResult

  writer_agent:
    name: 교육 콘텐츠 작성 Agent
    goal: 검증된 기획에 따라 이해하기 쉬운 교육용 블로그 초안을 작성한다.
    instructions: |
      기획의 학습 목표와 핵심 포인트를 빠짐없이 본문에 반영하세요.
      외부에서 확인하지 않은 사실을 새로 만들지 마세요.
    provider: openai
    output_contract: ContentDraftResult

  reviewer_agent:
    name: 교육 콘텐츠 검토 Agent
    goal: 글의 정확성, 구성, 가독성과 요청 충족 여부를 판정한다.
    instructions: |
      제공된 요청, 기획과 글만 근거로 검토하세요.
      통과하지 못한 경우 수정 가능한 문제를 구체적으로 작성하세요.
    provider: openai
    output_contract: ContentReviewResult

  reviser_agent:
    name: 교육 콘텐츠 수정 Agent
    goal: 첫 검토에서 발견된 문제를 반영해 블로그 글을 한 번 수정한다.
    instructions: |
      검토에서 지적된 문제만 근거로 수정하고 변경 사항을 명시하세요.
      기획의 학습 목표와 범위를 임의로 바꾸지 마세요.
    provider: openai
    output_contract: ContentRevisionResult
